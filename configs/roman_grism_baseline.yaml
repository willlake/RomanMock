# Baseline Roman grism emission-line mock (plan sections 1-3) plus one example sample.
# Run:   romanmock run configs/roman_grism_baseline.yaml
#        romanmock select configs/roman_grism_baseline.yaml
# Two-step workflow (read the input mock once, vary the limits afterwards):
#        romanmock base   configs/roman_grism_baseline.yaml --workers 32      # step 1: base flux catalog -> base.dir
#        romanmock assign configs/roman_grism_baseline.yaml --flux-limit 1.5e-16 --output-dir <dir>   # step 2 -> parent catalog
#        romanmock select <dir>/config.yaml                                   # samples, as usual
catalog:
  path: /global/cfs/cdirs/m4943/Simulations/sdss_feniks_hizels_260710_09_07_2026
  files: null          # explicit list of lc_cores-*.diffsky_gals.hdf5 (relative to path), or null for all
  steps: null          # e.g. [219, 224] to process only these slices
  z_min: 0.4           # only slices overlapping [z_min, z_max] are processed (Ha/[O III]/[O II] in 1.0-1.93 um)
  z_max: 4.0
  open_kwargs: {synth_cores: false, keep_top_host: true}
  rest_waves_from_catalog: true   # take rest wavelengths from the diffsky ssp_data file

output:
  dir: /pscratch/sd/w/willlake/roman/romanmock_baseline
  tag: romanmock                  # output files are lc_cores-<step>.<tag>.hdf5
  overwrite: false
  keep_undetected: false          # drop galaxies with line_bitmask == 0
  passthrough_columns: [ra, dec, redshift_true]   # copied from the input; add gal_id, logsm_obs, roman_F158, ... if needed
  store_identification: true      # line_bitmask, n_det, line_true, line_assigned (needed by `select` and the diagnostics)
  sample_columns: [ra, dec, redshift_true, redshift_rsd, redshift_assigned, id_outcome]   # columns of the sample files (null = all)
  store_fluxes: false
  store_wave_obs: false
  store_snr: false
  store_measured_flux: false
  compress_index: true            # store the HEALPix index gzip-compressed: 268 MB -> ~1 MB per file, data untouched
  sample_layout: slices           # samples/<name>/ with one file per slice (runs on a login node); single = one file

# Base flux catalog of the two-step workflow. Step 1 (`romanmock base`) keeps the galaxies with at least one
# line above sensitivity.flux_limit inside the bandpass and stores `columns`, redshift_rsd, the flux of every
# line of the line set and the bitmask at the base limits. Step 2 (`romanmock assign`, or `source: base`)
# redoes detection and redshift assignment from it; its limits must not be deeper than the base ones.
source: catalog                   # input of `romanmock run`: catalog (the diffsky mock) or base (the base catalog)
base:
  dir: /pscratch/sd/w/willlake/roman/romanmock_base
  tag: romanmock_base             # files are lc_cores-<step>.<tag>.hdf5
  overwrite: false
  columns: [gal_id, ra, dec, redshift_true]   # copied from the input mock; add logsm_obs, roman_F158, ... if needed
  store_bitmask: true             # line_bitmask at the base limits
  flux_dtype: float64             # float32 saves 4 bytes per line and galaxy
  compress_index: true

# Bit ordering (see `romanmock lines roman_transitions`):
#   0 Ha, 1 Hb, 2 OIII_5007, 3 OIII_4959, 4 OII_3727 (blend), 5 SIII_9532, 6 SIII_9069, 7 OIII_4363, 8 SIII_6312
line_set: roman_transitions

flux:
  redshift_column: redshift_true  # luminosity distance uses the cosmological redshift
  backend: astropy                # or dsps (JAX routine diffsky uses internally)
  suffix: _flux

sensitivity:                      # initial model: constant thresholds inside the grism bandpass
  type: constant
  flux_limit: 1.0e-16             # erg/s/cm^2, primary limit (HLSS reference depth at 6.5 sigma)
  secondary_flux_limit: 4.0e-17   # limit for the other lines of a galaxy with one line above flux_limit (null: off)
  wave_range: [10000.0, 19300.0]  # Angstrom (1.00-1.93 um)
  # wavelength-dependent alternative:
  # type: tabulated
  # file: sensitivity_curve.txt   # two columns: wavelength [A], flux limit
  # wave_unit: angstrom
  # secondary_ratio: 0.4          # secondary limit = ratio x tabulated limit (omit: single tier)

detection:
  type: threshold                 # F > F_lim(lambda_obs); or gaussian_noise with snr_at_limit / snr_threshold

confusion:                        # assumed scenario, not a calibrated Roman prediction (the package default, written out)
  type: matrix
  default_p_fail: 0.0             # rows not listed: identity with this failure probability
  rows:                           # true line: {assigned line: probability, ...}
    Ha:        {OIII_5007: 0.005, fail: 0.0}
    OIII_5007: {Ha: 0.05, fail: 0.0}
    SIII_9532: {Ha: 0.05, fail: 0.0}
    Hb:        {OIII_5007: 0.05, fail: 0.0}
  # alternatives:
  # type: default                 # the rows above, adapted to the names of the line set
  # type: identity
  # p_fail: 0.0
  # type: wavelength_binned
  # edges: [10000, 15000, 19300]
  # matrices: [{rows: {...}}, {file: confusion_red.yaml}]

redshift:
  rsd_column: redshift_obs        # input column with peculiar velocity; written out as redshift_rsd
  sigma_z: 0.0                    # optional Gaussian error sigma_z (1+z) for multi-line redshifts
  context_columns: []             # columns forwarded to the confusion model (e.g. roman_F158); two-step: must be in base.columns

# Match the detected-line populations to the Roman HLSS forecast of Wang et al. (2022,
# arXiv:2110.01829, Tables 1-2: true emitters above the flux limit, observational efficiency
# not included), in bins of true redshift, before any sample is selected. The reference is
# looked up at the run's primary flux limit (must be one of 5e-17, 7e-17, 8.5e-17, 1e-16, 1.5e-16,
# 2e-16, or give flux_limit in the target) and dust model A_V = 1.65 (or 1.92).
# Set to null to keep the mock's own abundances.
population_thinning:
  targets:
    Ha:        {reference: wang2022, dust_av: 1.65}
    OIII_5007: {reference: wang2022, dust_av: 1.65}
  by: line_true              # population membership: brightest detected feature
  z_column: redshift_rsd     # true redshift (with peculiar velocity)
  smooth_bins: 0.0
  poly_degree: null          # e.g. 4 for a smooth selection function instead of per-bin ratios
  outside_range: keep        # galaxies outside the tabulated z range / without a target are kept

samples:                     # written by `romanmock select` to <output.dir>/samples/<name>/
  - name: halpha_z1p0_1p9
    z_min: 1.0
    z_max: 1.9
    outcomes: [MULTI_LINE, SINGLE_CORRECT, SINGLE_MISID]   # what an observer keeps
    assigned_lines: [Ha]                                    # tracer: galaxies *assigned* Ha
    footprint: null                                         # or {type: box, ra_min: 0, ra_max: 45, dec_min: 55, dec_max: 65}
    downsample: null                                        # per-sample thinning on redshift_assigned, e.g. {target: {reference: wang2022}, nbins: 45}
  - name: oiii_z2p0_2p9
    z_min: 2.0
    z_max: 2.9
    assigned_lines: [OIII_5007]

seed: 12345
