# Baseline Roman grism emission-line mock (plan sections 1-3) plus one example sample.
# Run:   romanmock run configs/roman_grism_baseline.yaml
#        romanmock select configs/roman_grism_baseline.yaml
catalog:
  path: /global/cfs/cdirs/m4943/Simulations/sdss_feniks_hizels_260710_09_07_2026
  files: null          # explicit list of lc_cores-*.diffsky_gals.hdf5 (relative to path), or null for all
  steps: null          # e.g. [219, 224] to process only these slices
  z_min: 0.4           # only slices overlapping [z_min, z_max] are processed (Ha/[O III]/[O II] in 1.0-1.93 um)
  z_max: 4.0
  open_kwargs: {synth_cores: false, keep_top_host: true}
  rest_waves_from_catalog: true   # take rest wavelengths from the diffsky ssp_data file

output:
  dir: /pscratch/sd/w/willlake/roman/romanmock_baseline
  tag: romanmock                  # output files are lc_cores-<step>.<tag>.hdf5
  overwrite: false
  keep_undetected: false          # drop galaxies with line_bitmask == 0
  passthrough_columns: [ra, dec, redshift_true]   # copied from the input; add gal_id, logsm_obs, roman_F158, ... if needed
  store_identification: true      # line_bitmask, n_det, line_true, line_assigned (needed by `select` and the diagnostics)
  sample_columns: [ra, dec, redshift_true, redshift_rsd, redshift_assigned, id_outcome]   # columns of the sample files (null = all)
  store_fluxes: false
  store_wave_obs: false
  store_snr: false
  store_measured_flux: false

# Bit ordering (see `romanmock lines roman_transitions`):
#   0 Ha, 1 Hb, 2 OIII_5007, 3 OIII_4959, 4 OII_3727 (blend), 5 SIII_9532, 6 SIII_9069, 7 OIII_4363, 8 SIII_6312
line_set: roman_transitions

flux:
  redshift_column: redshift_true  # luminosity distance uses the cosmological redshift
  backend: astropy                # or dsps (JAX routine diffsky uses internally)
  suffix: _flux

sensitivity:                      # initial model: constant threshold inside the grism bandpass
  type: constant
  flux_limit: 1.5e-16             # erg/s/cm^2 (HLSS reference depth is 1e-16 at 6.5 sigma)